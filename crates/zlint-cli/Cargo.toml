[package]
name = "zlint-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zlint"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
zlint-linter.workspace = true
zlint-policy.workspace = true
zlint-signer.workspace = true
zlint-store.workspace = true
zlint-tx.workspace = true
zlint-types.workspace = true

[dev-dependencies]
hex.workspace = true
incrementalmerkletree = "0.8"
orchard = "0.15.5"
pasta_curves = "0.5"
pczt = { version = "0.9.3", default-features = false, features = ["std", "orchard", "sapling", "signer", "io-finalizer", "zcp-builder"] }
rand = "0.8"
serde_json.workspace = true
shardtree = "0.7"
zcash_note_encryption = "0.4"
zcash_primitives = { version = "0.30", default-features = false, features = ["transparent-inputs"] }
zcash_protocol = { version = "0.10.4", features = ["local-consensus"] }
zlint-policy.workspace = true
zlint-signer.workspace = true
zlint-tx.workspace = true
zlint-types.workspace = true
